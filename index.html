<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Edit HTML, CSS, and JavaScript against the New York State Design System and share the result with a link."
    />
    <title>NYSDS Playground</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar" id="toolbar">
        <h1 class="toolbar__title" id="app-title">NYSDS Playground</h1>

        <div class="toolbar__controls">
          <nys-select
            id="deck-select"
            class="toolbar__select"
            label="Deck"
            width="md"
            hidden
          ></nys-select>

          <nys-select
            id="preset-select"
            class="toolbar__select"
            label="Example"
            width="md"
          ></nys-select>

          <nys-select
            id="version-select"
            class="toolbar__select"
            label="Version"
            width="md"
          ></nys-select>

        </div>

        <div class="toolbar__actions">
          <nys-button id="share-button" size="sm" label="Share" prefixIcon="link"></nys-button>
          <nys-button
            id="export-button"
            size="sm"
            variant="outline"
            label="Export preset"
            prefixIcon="download"
          ></nys-button>
          <nys-button
            id="reset-button"
            size="sm"
            variant="outline"
            label="Reset"
            prefixIcon="refresh"
          ></nys-button>
          <nys-button
            id="present-button"
            size="sm"
            variant="ghost"
            label="Present"
            prefixIcon="visibility"
          ></nys-button>
          <nys-button
            id="settings-button"
            size="sm"
            variant="ghost"
            label="Settings"
            prefixIcon="more_vert"
          ></nys-button>
        </div>
      </header>

      <main class="split" id="split">
        <section class="split__pane split__pane--editors" id="editors" aria-label="Code editors">
          <div class="editors__layout editors__layout--tabs" id="tabs-layout">
            <playground-tab-bar
              project="project"
              editor="file-editor"
              class="editors__tabs"
            ></playground-tab-bar>
            <playground-file-editor
              id="file-editor"
              project="project"
              line-numbers
              line-wrapping
              class="editors__editor"
            ></playground-file-editor>
          </div>

          <div class="editors__layout editors__layout--columns" id="columns-layout" hidden>
            <section class="column" id="column-html" data-pane="html">
              <header class="column__header">
                <button
                  type="button"
                  class="column__label"
                  id="column-html-label"
                  aria-expanded="true"
                  aria-controls="column-html-editor"
                >
                  HTML
                </button>
                <nys-button
                  class="column__collapse"
                  id="column-html-collapse"
                  circle
                  size="sm"
                  variant="ghost"
                  icon="chevron_left"
                  label="Collapse HTML"
                ></nys-button>
              </header>
              <playground-file-editor
                id="column-html-editor"
                class="column__editor"
                project="project"
                filename="index.html"
                line-numbers
                line-wrapping
              ></playground-file-editor>
            </section>
            <section class="column" id="column-css" data-pane="css">
              <header class="column__header">
                <button
                  type="button"
                  class="column__label"
                  id="column-css-label"
                  aria-expanded="true"
                  aria-controls="column-css-editor"
                >
                  CSS
                </button>
                <nys-button
                  class="column__collapse"
                  id="column-css-collapse"
                  circle
                  size="sm"
                  variant="ghost"
                  icon="chevron_left"
                  label="Collapse CSS"
                ></nys-button>
              </header>
              <playground-file-editor
                id="column-css-editor"
                class="column__editor"
                project="project"
                filename="styles.css"
                line-numbers
                line-wrapping
              ></playground-file-editor>
            </section>
            <section class="column" id="column-js" data-pane="js">
              <header class="column__header">
                <button
                  type="button"
                  class="column__label"
                  id="column-js-label"
                  aria-expanded="true"
                  aria-controls="column-js-editor"
                >
                  JS
                </button>
                <nys-button
                  class="column__collapse"
                  id="column-js-collapse"
                  circle
                  size="sm"
                  variant="ghost"
                  icon="chevron_left"
                  label="Collapse JS"
                ></nys-button>
              </header>
              <playground-file-editor
                id="column-js-editor"
                class="column__editor"
                project="project"
                filename="script.js"
                line-numbers
                line-wrapping
              ></playground-file-editor>
            </section>
          </div>
        </section>

        <div
          class="split__divider"
          id="divider"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize the editors and the preview"
          tabindex="0"
        ></div>

        <section class="split__pane split__pane--preview" aria-label="Live preview">
          <playground-preview
            id="preview"
            project="project"
            html-file="index.html"
            class="preview"
          ></playground-preview>
          <nys-button
            class="preview__build"
            id="build-button"
            size="sm"
            variant="outline"
            label="Update preview"
            prefixIcon="refresh"
            hidden
          ></nys-button>
        </section>
      </main>

      <div class="notes" id="notes" role="dialog" aria-labelledby="notes-heading" hidden>
        <h2 class="notes__heading" id="notes-heading">Presenter notes</h2>
        <div class="notes__body" id="notes-body"></div>
        <nys-button
          id="notes-close"
          size="sm"
          variant="ghost"
          label="Close notes"
          prefixIcon="close"
        ></nys-button>
      </div>

      <footer class="caption" id="caption" tabindex="-1" hidden>
        <nys-button
          inverted
          id="prev-button"
          size="sm"
          variant="outline"
          circle
          icon="chevron_left"
          label="Previous slide"
        ></nys-button>
        <div class="caption__text">
          <p class="caption__title">
            <span class="caption__group" id="caption-group"></span>
            <span id="caption-title"></span>
          </p>
          <p class="caption__description" id="caption-description"></p>
        </div>
        <p class="caption__count" id="caption-count"></p>
        <nys-button
          inverted
          id="reset-slide-button"
          size="sm"
          variant="outline"
          label="Reset slide"
          prefixIcon="refresh"
        ></nys-button>
        <nys-button
          inverted
          id="notes-button"
          size="sm"
          variant="ghost"
          label="Notes"
          prefixIcon="info"
        ></nys-button>
        <nys-button
          inverted
          id="next-button"
          size="sm"
          variant="outline"
          circle
          icon="chevron_right"
          label="Next slide"
        ></nys-button>
      </footer>

      <p class="present-hint" id="present-hint" hidden></p>

      <nys-modal id="settings-modal" heading="Settings" width="md">
        <div class="settings">
          <nys-toggle
            id="theme-toggle"
            class="settings__field"
            size="sm"
            label="Dark editor"
            description="Changes the code editors only. The preview always shows the design system as it is."
            name="editor-theme"
            value="dark"
          ></nys-toggle>

          <nys-toggle
            id="columns-toggle"
            class="settings__field"
            size="sm"
            label="Side by side editors"
            description="Shows HTML, CSS, and JavaScript in three columns instead of tabs."
            name="editor-layout"
            value="columns"
          ></nys-toggle>

          <nys-select
            id="font-size-select"
            class="settings__field"
            width="md"
            label="Editor font size"
          >
            <option value="small" label="Small (13px)"></option>
            <option value="medium" label="Medium (15px)"></option>
            <option value="large" label="Large (18px)"></option>
          </nys-select>

          <nys-select
            id="update-mode-select"
            class="settings__field"
            width="lg"
            label="Update preview"
            description="How soon an edit reaches the preview. Cmd or Ctrl plus Enter updates it at once."
          >
            <option value="typing" label="While typing"></option>
            <option value="pause" label="After a longer pause"></option>
            <option value="manual" label="Manually"></option>
          </nys-select>

          <nys-toggle
            id="prerelease-toggle"
            class="settings__field"
            size="sm"
            label="Show prerelease versions"
            name="prereleases"
            value="on"
          ></nys-toggle>

          <nys-button
            id="reset-settings-button"
            class="settings__reset"
            size="sm"
            variant="outline"
            label="Reset settings"
            prefixIcon="refresh"
          ></nys-button>
        </div>
        <div slot="actions">
          <nys-button id="settings-done-button" label="Done"></nys-button>
        </div>
      </nys-modal>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <playground-project id="project"></playground-project>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
