# Serves the built static app. No restrictive Content-Security-Policy
# headers here: the app embeds a cross-origin iframe from unpkg.com and
# fetches script and style bundles from cdn.jsdelivr.net and metadata from
# data.jsdelivr.com, so a locked-down CSP would break the preview.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed, immutable build assets can cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The preview iframe runs on another origin and loads the fonts from
    # here, and font requests always need CORS.
    location /fonts/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000";
    }

    # The HTML entry point must always revalidate so deploys show up
    # immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
